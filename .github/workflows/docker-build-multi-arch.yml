name: Docker build (multi-arch)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing annotated release tag to build, for example 0.04"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release metadata
        id: release_metadata
        shell: bash
        run: bash .github/scripts/verify-release.sh "$RELEASE_TAG"

      - name: Allow slower CPAN configuration under emulation
        shell: bash
        run: |
          if ! grep -q -- "--configure-timeout" docker/Dockerfile; then
            sed -i "s/cpanm --notest/cpanm --configure-timeout 300 --notest/" docker/Dockerfile
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            manuelrueda/clarid-tools:${{ steps.release_metadata.outputs.version }}
            manuelrueda/clarid-tools:latest
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_VERSION=${{ steps.release_metadata.outputs.version }}
            VCS_REF=${{ steps.release_metadata.outputs.revision }}
          labels: |
            org.opencontainers.image.title=ClarID-Tools
            org.opencontainers.image.description=Toolkit for generating and validating ClarID identifiers
            org.opencontainers.image.source=https://github.com/CNAG-Biomedical-Informatics/clarid-tools
            org.opencontainers.image.version=${{ steps.release_metadata.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release_metadata.outputs.revision }}
            org.opencontainers.image.licenses=Artistic-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
